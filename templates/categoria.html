<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'layout.html' %}
{% block content %}
<div class="container py-5">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/dashboard">Inicio</a></li>
        <li class="breadcrumb-item active text-capitalize">{{ tipo }}</li>
      </ol>
    </nav>

    <h2 class="fw-bold text-uppercase mb-4 text-success border-bottom pb-2">Cursos de {{ tipo }}</h2>
    
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for curso in cursos %}
        <div class="col">
            <div class="card h-100 border-0 shadow-sm hover-shadow">
                <div class="card-body p-4">
                    <h5 class="card-title fw-bold">{{ curso }}</h5>
                    <p class="text-muted">Inicia este curso para aprender nuevas técnicas y fortalecer tu desarrollo personal.</p>
                    <a href="/curso/{{ curso }}" class="btn btn-outline-success w-100 rounded-pill">Iniciar Curso</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
</body>
</html>
