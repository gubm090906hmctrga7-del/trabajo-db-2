<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'layout.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 text-center">
                <h2 class="fw-bold text-success mb-3">Recuperar Cuenta</h2>
                <p class="text-muted small mb-4">Ingresa tus datos exactos para validar tu identidad.</p>
                
                <form action="/recuperar" method="POST">
                    <div class="mb-3 text-start">
                        <label class="small fw-bold">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control rounded-pill" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="small fw-bold">Edad</label>
                        <input type="number" name="edad" class="form-control rounded-pill" required>
                    </div>
                    <div class="mb-4 text-start">
                        <label class="small fw-bold">Correo Electrónico</label>
                        <input type="email" name="correo" class="form-control rounded-pill" required>
                    </div>
                    <button class="btn btn-success w-100 rounded-pill fw-bold py-2">VALIDAR MI IDENTIDAD</button>
                    <a href="/" class="btn btn-link text-muted mt-3">Volver al inicio</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
